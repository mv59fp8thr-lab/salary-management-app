<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>給料管理</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}h1{font-size:34px;margin:12px 0 4px}.sub{color:#687386;margin-bottom:22px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1f29370d}label{display:block;font-size:13px;color:#667085;margin:10px 0 6px}select,input{width:100%;padding:14px;border:1px solid #d6dce7;border-radius:13px;font-size:16px;background:#fff}button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#3563e9;color:#fff;margin-top:12px}.secondary{background:#eaf0ff;color:#2852c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f8fc;border-radius:15px;padding:14px}.stat small{display:block;color:#6b7280;margin-bottom:5px}.stat strong{font-size:20px}.pay{background:#172033;color:white}.pay small{color:#cbd5e1}.pay strong{font-size:28px}.notice{background:#fff7db;color:#745b00;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}.ok{background:#eaf8ef;color:#176b37}.people{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{width:auto;padding:9px 13px;margin:0;background:#eef2f7;color:#273142}.detail{border-top:1px solid #edf0f5;padding:10px 0;display:flex;justify-content:space-between;gap:12px}.detail span{color:#667085}.hidden{display:none}@media(max-width:480px){.wrap{padding:20px 14px 50px}h1{font-size:30px}}
</style></head><body><main class="wrap"><h1>給料管理</h1><div class="sub">勤怠管理と連携して月給を自動計算</div>
<div id="sync" class="notice">勤怠データを確認しています…</div>
<section class="card"><h2>給与計算</h2><label>対象者</label><select id="user"></select><label>対象月</label><input id="month" type="month"><div class="grid"><div><label>時給（円）</label><input id="rate" type="number" min="0" inputmode="numeric"></div><div><label>交通費・手当（円）</label><input id="allowance" type="number" inputmode="numeric" value="0"></div></div><label>控除（円）</label><input id="deduction" type="number" inputmode="numeric" value="0"><button id="save">設定を保存して再計算</button></section>
<section class="card"><h2>月間集計</h2><div class="grid"><div class="stat"><small>出勤日数</small><strong id="days">0日</strong></div><div class="stat"><small>実働合計</small><strong id="hours">0時間0分</strong></div><div class="stat"><small>休憩合計</small><strong id="breaks">0時間0分</strong></div><div class="stat"><small>基本給</small><strong id="base">¥0</strong></div></div></section>
<section class="card pay"><small>差引支給額</small><strong id="net">¥0</strong><div style="margin-top:10px;font-size:14px;color:#d9e1ef" id="formula"></div></section>
<section class="card"><h2>日別明細</h2><div id="details"></div></section>
<section class="card"><h2>勤怠管理との連携</h2><div class="notice ok">このアプリと勤怠管理を同じ <b>mv59fp8thr-lab.github.io</b> で公開すると、勤怠側の登録者・勤務記録を自動で読み込みます。</div><button class="secondary" onclick="location.href='/attendance-system/'">勤怠管理を開く</button></section>
</main><script>
const USERS_KEY='attendance_users_v1';
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'); const pad=n=>String(n).padStart(2,'0');
function users(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch{return[]}}
function records(name){try{return JSON.parse(localStorage.getItem('attendance_records_user_'+encodeURIComponent(name))||'[]')}catch{return[]}}
function mins(t){if(!t)return null;const [h,m]=String(t).split(':').map(Number);if(!Number.isFinite(h)||!Number.isFinite(m)||h<0||h>23||m<0||m>59)return null;return h*60+m}
function interval(start,end){const a=mins(start),b=mins(end);if(a==null||b==null)return null;return [a,b<a?b+1440:b]}
function mergeIntervals(items){const a=items.filter(Boolean).sort((x,y)=>x[0]-y[0]);const out=[];for(const x of a){if(!out.length||x[0]>out[out.length-1][1])out.push([...x]);else out[out.length-1][1]=Math.max(out[out.length-1][1],x[1])}return out}
function duration(items){return mergeIntervals(items).reduce((n,[a,b])=>n+Math.max(0,b-a),0)}
function overlapDuration(a,b){let n=0;for(const x of mergeIntervals(a))for(const y of mergeIntervals(b))n+=Math.max(0,Math.min(x[1],y[1])-Math.max(x[0],y[0]));return n}
function getSessions(r){return Array.isArray(r?.sessions)?r.sessions:(r?.in?[{in:r.in,out:r.out||null}]:[])}
function sessionIntervals(r){return getSessions(r).filter(s=>s&&s.in&&s.out).map(s=>interval(s.in,s.out)).filter(Boolean)}
function breakIntervals(r){return (Array.isArray(r?.breaks)?r.breaks:[]).filter(b=>b&&b.start&&b.end).map(b=>interval(b.start,b.end)).filter(Boolean)}
function breakTotal(r){return duration(breakIntervals(r))}
function workTotal(r){const work=sessionIntervals(r),br=breakIntervals(r);return Math.max(0,duration(work)-overlapDuration(work,br))}
function fmt(m){return Math.floor(m/60)+'時間'+(m%60)+'分'}
function key(n){return 'salary_settings_'+encodeURIComponent(n)} function settings(n){try{return JSON.parse(localStorage.getItem(key(n))||'{}')}catch{return{}}}
const u=document.getElementById('user'), mo=document.getElementById('month'); const now=new Date();mo.value=now.getFullYear()+'-'+pad(now.getMonth()+1);
function init(){const us=users();u.innerHTML='';us.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;u.appendChild(o)});document.getElementById('sync').className='notice '+(us.length?'ok':'');document.getElementById('sync').textContent=us.length?'勤怠管理と連携済み：'+us.length+'名を読み込みました。':'勤怠管理の登録者が見つかりません。同じSafariで勤怠管理を一度開いてください。';loadSettings();calc()}
function loadSettings(){const s=settings(u.value);document.getElementById('rate').value=s.rate??1200;document.getElementById('allowance').value=s.allowance??0;document.getElementById('deduction').value=s.deduction??0}
function calc(){const name=u.value;if(!name){document.getElementById('details').textContent='登録者がいません';return}const [y,m]=mo.value.split('-').map(Number),prefix=`${y}/${pad(m)}/`;const rs=records(name).filter(r=>String(r.date||'').startsWith(prefix));let work=0,br=0,days=0;rs.forEach(r=>{if(getSessions(r).some(s=>s.in))days++;work+=workTotal(r);br+=breakTotal(r)});const rate=Number(document.getElementById('rate').value)||0,al=Number(document.getElementById('allowance').value)||0,de=Number(document.getElementById('deduction').value)||0,base=work/60*rate,net=base+al-de;daysEl=document.getElementById('days');daysEl.textContent=days+'日';document.getElementById('hours').textContent=fmt(work);document.getElementById('breaks').textContent=fmt(br);document.getElementById('base').textContent=yen(base);document.getElementById('net').textContent=yen(net);document.getElementById('formula').textContent=`基本給 ${yen(base)} ＋ 手当 ${yen(al)} － 控除 ${yen(de)}`;document.getElementById('details').innerHTML=rs.length?[...rs].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(r=>`<div class="detail"><span>${r.date}</span><b>${fmt(workTotal(r))}</b></div>`).join(''):'<div class="notice">この月の勤怠記録はありません。</div>'}
u.addEventListener('change',()=>{loadSettings();calc()});mo.addEventListener('change',calc);['rate','allowance','deduction'].forEach(id=>document.getElementById(id).addEventListener('input',calc));document.getElementById('save').onclick=()=>{if(!u.value)return;localStorage.setItem(key(u.value),JSON.stringify({rate:Number(rate.value)||0,allowance:Number(allowance.value)||0,deduction:Number(deduction.value)||0}));calc();alert('給与設定を保存しました。')};
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').then(r=>r.update()).catch(()=>{})}init();
</script></body></html>
